<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standard Calculator | CalcHub</title><link rel="stylesheet" href="styles.css"><script src="calculator.js" defer></script></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span> CalcHub</a><a class="header-note" href="index.html">All calculators</a></header><main class="calc-main"><a class="calc-back" href="index.html">← All calculators</a><div class="calc-heading"><span class="eyebrow">BASIC MATH</span><h1>Standard calculator</h1><p>Enter a calculation or tap the buttons. Use brackets to control the order of operations.</p></div><div class="calc-layout"><section class="simple-card"><h2>Your calculation</h2><form id="calculator-form" data-kind="basic"><label class="simple-field" for="expression">Expression</label><input class="expression" id="expression" aria-label="Calculation expression" inputmode="decimal" placeholder="Example: (12 + 8) × 3"><div class="calculator-pad"><button type="button" data-action="clear" class="operation">AC</button><button type="button" data-key="(">(</button><button type="button" data-key=")">)</button><button type="button" data-key="/" class="operation">÷</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="*" class="operation">×</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="-" class="operation">−</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="+" class="operation">+</button><button type="button" data-key="0">0</button><button type="button" data-key=".">.</button><button type="button" data-key="%">%</button><button type="button" data-action="equals" class="operation">=</button></div></form></section><section class="simple-card"><h2>Answer</h2><div id="results" class="results-box" aria-live="polite"></div><p class="result-note">Keyboard input is supported. Press Enter to finish a calculation.</p></section></div></main></body></html>
