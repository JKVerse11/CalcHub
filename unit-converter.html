<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter | CalcHub</title><link rel="stylesheet" href="styles.css"><script src="calculator.js" defer></script></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span> CalcHub</a><a class="header-note" href="index.html">All calculators</a></header><main class="calc-main"><a class="calc-back" href="index.html">← All calculators</a><div class="calc-heading"><span class="eyebrow">EVERYDAY</span><h1>Unit converter</h1><p>Convert common length, weight and temperature units.</p></div><div class="calc-layout"><section class="simple-card"><h2>Conversion</h2><form id="calculator-form" data-kind="units" class="simple-fields"><div class="simple-field"><label for="unit">What to convert</label><select id="unit" name="unit"><option value="length">Length</option><option value="weight">Weight</option><option value="temperature">Temperature</option></select></div><div class="simple-field"><label for="value">Value</label><input id="value" name="value" type="number" step="any" value="1"></div><div class="simple-fields two"><div class="simple-field"><label for="from">From</label><select id="from" name="from"><option value="m">Metres (m)</option><option value="km">Kilometres (km)</option><option value="cm">Centimetres (cm)</option><option value="mi">Miles (mi)</option><option value="ft">Feet (ft)</option><option value="in">Inches (in)</option></select></div><div class="simple-field"><label for="to">To</label><select id="to" name="to"><option value="km">Kilometres (km)</option><option value="m">Metres (m)</option><option value="cm">Centimetres (cm)</option><option value="mi">Miles (mi)</option><option value="ft">Feet (ft)</option><option value="in">Inches (in)</option></select></div></div></form></section><section class="simple-card"><h2>Converted result</h2><div id="results" class="results-box" aria-live="polite"></div></section></div></main><script>const units=document.querySelector('#unit'),from=document.querySelector('#from'),to=document.querySelector('#to');const opts={length:[['m','Metres (m)'],['km','Kilometres (km)'],['cm','Centimetres (cm)'],['mi','Miles (mi)'],['ft','Feet (ft)'],['in','Inches (in)']],weight:[['kg','Kilograms (kg)'],['g','Grams (g)'],['lb','Pounds (lb)'],['oz','Ounces (oz)']],temperature:[['C','Celsius (°C)'],['F','Fahrenheit (°F)']]};units.addEventListener('change',()=>{[from,to].forEach(select=>{const prev=select.value;select.innerHTML=opts[units.value].map(([v,label])=>`<option value="${v}">${label}</option>`).join('');if(opts[units.value].some(([v])=>v===prev))select.value=prev;});document.querySelector('#calculator-form').dispatchEvent(new Event('input',{bubbles:true}));});</script></body></html>
