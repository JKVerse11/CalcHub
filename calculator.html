<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f43">
  <meta name="description" content="Use the JKCalcHub basic standard calculator for addition, subtraction, multiplication, division and remainder calculations.">
  <title>Basic Standard Calculator — JKCalcHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="currency.css">
  <script src="currency.js" defer></script>
  <script src="calculator.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="JKCalcHub home"><span class="brand-icon">JK</span><span>JKCalc<span class="brand-accent">Hub</span></span></a>
    <div class="header-actions"><label class="currency-picker" title="Choose currency"><span>Currency</span><select id="global-currency" aria-label="Choose currency"><option value="INR">₹ INR</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option><option value="JPY">¥ JPY</option><option value="AUD">A$ AUD</option><option value="CAD">C$ CAD</option><option value="SGD">S$ SGD</option><option value="AED">د.إ AED</option></select></label></div>
  </header>
  <main class="calc-main">
    <a class="back-link" href="index.html#calculators">← All calculators</a>
    <section class="calc-heading"><div class="tool-icon icon-purple" aria-hidden="true">＋</div><span id="calc-category" class="eyebrow">SIMPLE &amp; EVERYDAY</span><h1 id="calc-title">Basic standard calculator</h1><p>Enter two numbers, choose an operation, and calculate the result.</p></section>
    <div class="calc-layout">
      <section class="calc-panel" aria-labelledby="input-title"><h2 class="panel-title" id="input-title">Enter values</h2><form id="calc-form" novalidate><div class="form-grid" id="form-fields"></div><button class="calculate-button" type="submit">Calculate result →</button></form></section>
      <aside class="result-panel" aria-labelledby="result-title"><h2 class="panel-title" id="result-title">Result</h2><div id="result-content" class="result-empty">Enter values to see a result.</div></aside>
    </div>
  </main>
  <footer class="site-footer"><a class="brand" href="index.html"><span class="brand-icon">JK</span><span>JKCalc<span class="brand-accent">Hub</span></span></a><nav aria-label="Footer"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="disclaimer.html">Disclaimer</a></nav></footer>
</body>
</html>
