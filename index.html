<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>CalcHub — Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #232b42 0%, #10131c 58%);
    }

    .calculator { width: min(100%, 360px); }

    .brand {
      margin: 0 0 18px;
      color: #aab4ca;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
    }

    .panel {
      padding: 20px;
      border: 1px solid #ffffff12;
      border-radius: 28px;
      background: #191e2beF;
      box-shadow: 0 24px 70px #0008, inset 0 1px #ffffff0d;
    }

    .display {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 12px;
      overflow: hidden;
      padding: 12px 8px 22px;
    }

    .previous {
      width: 100%;
      min-height: 20px;
      overflow: hidden;
      color: #8994ab;
      font-size: 0.95rem;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current {
      width: 100%;
      overflow: hidden;
      color: #f7f8ff;
      font-size: clamp(2.5rem, 12vw, 3.5rem);
      font-weight: 500;
      letter-spacing: -0.06em;
      line-height: 1.1;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-width: 0;
      height: 64px;
      border: 0;
      border-radius: 18px;
      background: #252b3a;
      color: #f5f7ff;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #333b4e; }
    button:active { transform: scale(0.95); }
    button:focus-visible { outline: 2px solid #a9a0ff; outline-offset: 3px; }

    .utility { background: #303749; color: #c1c9da; }
    .operator { background: #282d40; color: #b4aaff; font-size: 1.45rem; }
    .operator.is-active { background: #6558d9; color: #fff; }
    .equals {
      background: linear-gradient(145deg, #8b7bff, #6757df);
      box-shadow: 0 8px 20px #6558d944;
      color: #fff;
    }
    .equals:hover { background: linear-gradient(145deg, #9a8cff, #7565ef); }
    .zero { grid-column: span 2; }

    @media (max-width: 380px) {
      .panel { padding: 16px; border-radius: 24px; }
      .keys { gap: 8px; }
      button { height: 58px; border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1 class="brand">CalcHub</h1>
    <section class="panel" aria-label="Simple calculator">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="previous" id="previous"></div>
        <output class="current" id="current">0</output>
      </div>
      <div class="keys">
        <button class="utility" data-action="clear" aria-label="All clear">AC</button>
        <button class="utility" data-action="sign" aria-label="Toggle sign">±</button>
        <button class="utility" data-action="percent" aria-label="Percent">%</button>
        <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="operator" data-operator="×" aria-label="Multiply">×</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="operator" data-operator="−" aria-label="Subtract">−</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="operator" data-operator="+" aria-label="Add">+</button>

        <button class="zero" data-digit="0">0</button>
        <button data-action="decimal" aria-label="Decimal point">.</button>
        <button class="equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
  </main>

  <script>
    const currentDisplay = document.querySelector('#current');
    const previousDisplay = document.querySelector('#previous');
    const operatorButtons = document.querySelectorAll('[data-operator]');

    let currentValue = '0';
    let storedValue = null;
    let pendingOperator = null;
    let replaceCurrent = false;

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = storedValue !== null && pendingOperator
        ? `${formatNumber(storedValue)} ${pendingOperator}`
        : '';
      operatorButtons.forEach((button) => {
        button.classList.toggle('is-active', button.dataset.operator === pendingOperator && !replaceCurrent);
      });
    }

    function formatNumber(value) {
      return Number(value).toLocaleString('en-US', { maximumFractionDigits: 10 });
    }

    function enterDigit(digit) {
      if (currentValue === 'Error' || replaceCurrent) {
        currentValue = digit;
        replaceCurrent = false;
      } else if (currentValue === '0') {
        currentValue = digit;
      } else if (currentValue.replace('-', '').length < 14) {
        currentValue += digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (currentValue === 'Error' || replaceCurrent) {
        currentValue = '0.';
        replaceCurrent = false;
      } else if (!currentValue.includes('.')) {
        currentValue += '.';
      }
      updateDisplay();
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case '+': return left + right;
        case '−': return left - right;
        case '×': return left * right;
        case '÷': return right === 0 ? NaN : left / right;
        default: return right;
      }
    }

    function cleanResult(value) {
      if (!Number.isFinite(value)) return 'Error';
      const rounded = Number.parseFloat(value.toPrecision(11));
      return String(Object.is(rounded, -0) ? 0 : rounded);
    }

    function chooseOperator(operator) {
      if (currentValue === 'Error') return;
      const input = Number(currentValue);
      if (pendingOperator && !replaceCurrent) {
        const result = calculate(Number(storedValue), input, pendingOperator);
        currentValue = cleanResult(result);
        if (currentValue === 'Error') {
          storedValue = null;
          pendingOperator = null;
          replaceCurrent = true;
          updateDisplay();
          return;
        }
      }
      storedValue = currentValue;
      pendingOperator = operator;
      replaceCurrent = true;
      updateDisplay();
    }

    function getResult() {
      if (!pendingOperator || storedValue === null || currentValue === 'Error') return;
      const result = calculate(Number(storedValue), Number(currentValue), pendingOperator);
      previousDisplay.textContent = `${formatNumber(storedValue)} ${pendingOperator} ${formatNumber(currentValue)} =`;
      currentValue = cleanResult(result);
      storedValue = null;
      pendingOperator = null;
      replaceCurrent = true;
      updateDisplay();
    }

    function clear() {
      currentValue = '0';
      storedValue = null;
      pendingOperator = null;
      replaceCurrent = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === 'clear') return clear();
      if (action === 'equals') return getResult();
      if (currentValue === 'Error') return;
      if (action === 'sign') {
        if (Number(currentValue) !== 0) currentValue = String(Number(currentValue) * -1);
      }
      if (action === 'percent') currentValue = cleanResult(Number(currentValue) / 100);
      if (action === 'decimal') return enterDecimal();
      replaceCurrent = false;
      updateDisplay();
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) return enterDigit(event.key);
      if (event.key === '.') return enterDecimal();
      if (event.key === 'Enter' || event.key === '=') {
        event.preventDefault();
        return getResult();
      }
      if (event.key === 'Escape' || event.key.toLowerCase() === 'c') return clear();
      const operators = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      if (operators[event.key]) {
        event.preventDefault();
        chooseOperator(operators[event.key]);
      }
      if (event.key === 'Backspace' && currentValue !== 'Error') {
        currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
        if (currentValue === '-') currentValue = '0';
        replaceCurrent = false;
        updateDisplay();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
